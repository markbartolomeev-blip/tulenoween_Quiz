<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проклятье Зомби-Курчаткиной</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Russo One', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; background: #2a0a38;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
}

#bg-spiral {
    position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: repeating-radial-gradient(circle at center,
        #f26d21 0px, #f26d21 60px, #572a7c 60px, #572a7c 120px);
    animation: spin 25s linear infinite;
    filter: blur(12px); z-index: -1;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.game-container {
    background: rgba(25, 0, 40, 0.93);
    padding: 22px 18px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 25px rgba(242,109,33,0.4);
    max-width: 580px; width: 100%;
    backdrop-filter: blur(6px);
    border: 3px solid #f26d21; z-index: 1;
    max-height: 96vh; overflow-y: auto;
    text-align: center;
}

h1 {
    color: #f26d21; font-size: 26px; margin-bottom: 20px;
    text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
    letter-spacing: 2px;
    animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
    from { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 10px #f26d21; }
    to { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 25px #f26d21; }
}

/* Карточка уравнения */
.equation-card {
    background: rgba(15, 2, 25, 0.85);
    border: 3px solid #f26d21;
    border-radius: 16px;
    padding: 26px 16px;
    box-shadow: inset 0 0 20px rgba(242,109,33,0.2);
    margin-bottom: 20px;
}

/* Само уравнение — как дробь */
.fraction {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 22px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px #000;
    margin: 8px 0;
}
.numerator {
    padding: 4px 20px 10px;
    border-bottom: 3px solid #f26d21;
    color: #fff;
}
.denominator {
    padding: 4px 20px;
    color: #fff;
}
.equals-zero {
    color: #f26d21;
    font-size: 24px;
    text-shadow: 0 0 10px #f26d21;
    margin-left: 8px;
    align-self: center;
}

.equation-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

/* Поле ввода */
.answer-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.input-label {
    color: #fff;
    font-size: 13px;
    letter-spacing: 1px;
}

.input-field {
    font-family: 'Russo One', sans-serif;
    font-size: 28px;
    text-align: center;
    background: rgba(15, 2, 25, 0.9);
    color: #f26d21;
    border: 3px solid #f26d21;
    border-radius: 12px;
    padding: 12px 20px;
    width: 100%;
    max-width: 260px;
    outline: none;
    transition: all 0.3s ease;
    text-shadow: 0 0 10px rgba(242,109,33,0.7);
    letter-spacing: 2px;
}
.input-field:focus {
    box-shadow: 0 0 25px rgba(242,109,33,0.7);
}
.input-field.correct {
    border-color: #4caf50;
    color: #4caf50;
    text-shadow: 0 0 15px #4caf50;
    box-shadow: 0 0 25px rgba(76,175,80,0.7);
}
.input-field.wrong {
    border-color: #ff3333;
    color: #ff5555;
    text-shadow: 0 0 15px #ff3333;
    box-shadow: 0 0 25px rgba(255,51,51,0.7);
    animation: shake 0.4s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

.btn {
    font-family: 'Russo One', sans-serif;
    font-size: 16px;
    background: #572a7c;
    color: #f26d21;
    border: 3px solid #f26d21;
    padding: 12px 30px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    text-shadow: 1px 1px 0 #000;
    margin-top: 6px;
}
.btn:hover {
    background: #f26d21;
    color: #572a7c;
    border-color: #572a7c;
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 5px 20px rgba(242,109,33,0.7);
}
.btn:active { transform: scale(0.95); }

.hint-msg {
    min-height: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    margin-top: 12px;
    color: #f26d21;
    text-shadow: 1px 1px 0 #000;
    transition: opacity 0.3s ease;
}
.hint-msg.good { color: #4caf50; text-shadow: 0 0 8px #4caf50, 1px 1px 0 #000; }
.hint-msg.warn { color: #ff5555; text-shadow: 0 0 8px #ff5555, 1px 1px 0 #000; }

/* Финальный экран */
.end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 10px;
    animation: fadeIn 0.8s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.end-screen h1 { font-size: 24px; line-height: 1.3; }

.end-screen p {
    color: #fff; font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px #000;
    text-align: center;
}
.end-screen p.sub { color: #ccc; font-size: 13px; }
.end-screen p.answer-big {
    color: #f26d21;
    font-size: 32px;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #f26d21, 2px 2px 0 #000;
    margin: 8px 0;
}
.end-screen p.final {
    color: #f26d21;
    font-size: 15px;
    text-shadow: 1px 1px 0 #000, 0 0 10px #f26d21;
}

@media (max-width: 600px) {
    h1 { font-size: 20px; }
    .fraction { font-size: 16px; }
    .numerator, .denominator { padding-left: 12px; padding-right: 12px; }
    .equals-zero { font-size: 18px; }
    .input-field { font-size: 22px; padding: 10px 14px; max-width: 200px; }
    .btn { font-size: 14px; padding: 10px 22px; }
    .end-screen h1 { font-size: 19px; }
    .end-screen p { font-size: 13px; }
    .end-screen p.answer-big { font-size: 26px; }
}
</style>
</head>
<body>

<div id="bg-spiral"></div>

<div class="game-container" id="game-container">

    <div id="main-screen">
        <h1>Проклятье Зомби-Курчаткиной</h1>

        <div class="equation-card">
            <div class="equation-row">
                <div class="fraction">
                    <div class="numerator">x³ − x² − 4x + 4</div>
                    <div class="denominator">x² − 3x + 2</div>
                </div>
                <div class="equals-zero">= 0</div>
            </div>
        </div>

        <div class="answer-area">
            <div class="input-label">ТВОЙ ОТВЕТ:</div>
            <input type="text" class="input-field" id="answer-input" placeholder="?" autocomplete="off" spellcheck="false">
            <button class="btn" id="check-btn" onclick="checkAnswer()">Проверить</button>
        </div>

        <div class="hint-msg" id="hint-msg"></div>
    </div>

    <div class="end-screen" id="end-screen">
        <h1>ПОЗДРАВЛЯЕМ! 🎃</h1>
        <p class="sub">Ты решил (-а) уравнение верно</p>
        <p class="answer-big">x = −2</p>
        <p class="final">Не забудь отправить скрин в группу!</p>
    </div>

</div>

<script>
    // ===== ПРАВИЛЬНЫЙ ОТВЕТ =====
    // Числитель: x³ − x² − 4x + 4 = (x−1)(x−2)(x+2) → корни 1, 2, −2
    // Знаменатель: x² − 3x + 2 = (x−1)(x−2) → x ≠ 1, x ≠ 2
    // Остаётся корень: x = −2
    const CORRECT_ANSWER = -2;

    const input = document.getElementById('answer-input');

    function checkAnswer() {
        const raw = input.value.trim().replace(',', '.').replace(/\s/g, '');
        if (!raw) {
            showHint('Введи число!', 'warn');
            return;
        }

        const num = Number(raw);

        if (isNaN(num)) {
            showHint('Это не число', 'warn');
            input.classList.add('wrong');
            setTimeout(() => input.classList.remove('wrong'), 500);
            return;
        }

        if (num === CORRECT_ANSWER) {
            input.classList.remove('wrong');
            input.classList.add('correct');
            showHint('Верно!', 'good');
            input.disabled = true;
            document.getElementById('check-btn').disabled = true;

            setTimeout(() => {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('end-screen').style.display = 'flex';
            }, 1000);
        } else {
            input.classList.remove('correct');
            input.classList.add('wrong');
            showHint('Неверно. Попробуй ещё раз', 'warn');
            setTimeout(() => input.classList.remove('wrong'), 500);
        }
    }

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    input.addEventListener('input', () => {
        input.classList.remove('wrong', 'correct');
    });

    let hintTimeout = null;
    function showHint(text, type) {
        const el = document.getElementById('hint-msg');
        el.textContent = text;
        el.className = 'hint-msg ' + (type || '');
        if (hintTimeout) clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => { el.textContent = ''; }, 2500);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Разбуди Игру</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Russo One', sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; background: #2a0a38;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
}

#bg-spiral {
    position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: repeating-radial-gradient(circle at center,
        #f26d21 0px, #f26d21 60px, #572a7c 60px, #572a7c 120px);
    animation: spin 25s linear infinite;
    filter: blur(12px); z-index: -1;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.game-container {
    background: rgba(25, 0, 40, 0.93);
    padding: 22px 18px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 25px rgba(242,109,33,0.4);
    max-width: 560px; width: 100%;
    backdrop-filter: blur(6px);
    border: 3px solid #f26d21; z-index: 1;
    max-height: 96vh; overflow-y: auto;
    text-align: center;
}

h1 {
    color: #f26d21; font-size: 26px; margin-bottom: 6px;
    text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000;
    letter-spacing: 2px;
    animation: glow 3s ease-in-out infinite alternate;
}
@keyframes glow {
    from { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 10px #f26d21; }
    to { text-shadow: 2px 2px 0 #572a7c, 4px 4px 0 #000, 0 0 25px #f26d21; }
}

.subtitle {
    color: #ccc; font-size: 13px; letter-spacing: 1px;
    margin-bottom: 16px;
}

.image-card {
    background: rgba(15, 2, 25, 0.85);
    border: 3px solid #f26d21;
    border-radius: 16px;
    padding: 10px;
    box-shadow: inset 0 0 20px rgba(242,109,33,0.2);
    margin-bottom: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 220px;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
}
.image-card.awake {
    box-shadow: inset 0 0 30px rgba(255,80,0,0.6), 0 0 40px rgba(242,109,33,0.9);
    transform: scale(1.02);
    animation: shake 0.15s infinite;
}
@keyframes shake {
    0%, 100% { transform: translate(0,0) scale(1.02); }
    25% { transform: translate(-2px, 1px) scale(1.02); }
    75% { transform: translate(2px, -1px) scale(1.02); }
}
.image-card img {
    max-width: 100%;
    max-height: 45vh;
    border-radius: 10px;
    display: block;
}

.sleep-bar {
    width: 100%;
    height: 26px;
    background: rgba(15, 2, 25, 0.9);
    border: 3px solid #f26d21;
    border-radius: 13px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    margin-bottom: 10px;
}
.sleep-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #572a7c, #f26d21, #ffcc00, #fff);
    transition: width 0.08s linear;
    box-shadow: 0 0 15px #f26d21;
}
.sleep-fill.hot {
    box-shadow: 0 0 25px #ffcc00, 0 0 40px #f26d21;
}

.btn {
    font-family: 'Russo One', sans-serif;
    font-size: 16px;
    background: #572a7c;
    color: #f26d21;
    border: 3px solid #f26d21;
    padding: 12px 30px;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    text-shadow: 1px 1px 0 #000;
    margin-top: 4px;
    touch-action: manipulation;
}
.btn:hover {
    background: #f26d21;
    color: #572a7c;
    border-color: #572a7c;
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 5px 20px rgba(242,109,33,0.7);
}
.btn:active { transform: scale(0.95); }

.tap-flash {
    position: fixed;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,204,0,0.9), rgba(242,109,33,0));
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: tapFlash 0.4s ease-out forwards;
    z-index: 999;
}
@keyframes tapFlash {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); }
}

.tap-counter {
    position: fixed;
    color: #ffcc00;
    font-size: 14px;
    pointer-events: none;
    text-shadow: 0 0 10px #ffcc00, 1px 1px 0 #000;
    transform: translate(-50%, 0);
    animation: tapCounter 0.6s ease-out forwards;
    z-index: 1000;
}
@keyframes tapCounter {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -40px); }
}
.tap-counter.blocked {
    color: #ff5555;
    text-shadow: 0 0 10px #ff5555, 1px 1px 0 #000;
}

.hint-msg {
    min-height: 20px;
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 10px;
    color: #f26d21;
    text-shadow: 1px 1px 0 #000;
    transition: opacity 0.3s ease;
}
.hint-msg.good { color: #4caf50; text-shadow: 0 0 8px #4caf50, 1px 1px 0 #000; }
.hint-msg.warn { color: #ff5555; text-shadow: 0 0 8px #ff5555, 1px 1px 0 #000; }

.end-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 10px;
    animation: fadeIn 0.8s ease;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

.end-screen h1 { font-size: 24px; line-height: 1.3; }

.end-screen p {
    color: #fff; font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px #000;
    text-align: center;
}
.end-screen p.sub { color: #ccc; font-size: 13px; }
.end-screen p.final {
    color: #f26d21;
    font-size: 15px;
    text-shadow: 1px 1px 0 #000, 0 0 10px #f26d21;
}

.start-screen {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 12px 8px;
    animation: fadeIn 0.6s ease;
}

.controls-box {
    background: rgba(87, 42, 124, 0.4);
    border: 2px dashed #f26d21;
    border-radius: 14px;
    padding: 14px 18px;
    display: flex; flex-direction: column; gap: 6px;
    max-width: 460px;
    text-align: left;
}
.controls-box .ctrl-title {
    color: #f26d21; font-size: 15px;
    letter-spacing: 1px; margin-bottom: 4px;
    text-shadow: 1px 1px 0 #000;
    text-align: center;
}
.controls-box .ctrl-line {
    color: #fff; font-size: 12px;
    line-height: 1.6; letter-spacing: 0.5px;
}
.controls-box .ctrl-line span { color: #f26d21; }

@media (max-width: 600px) {
    h1 { font-size: 20px; }
    .subtitle { font-size: 11px; }
    .image-card img { max-height: 35vh; }
    .btn { font-size: 13px; padding: 10px 20px; }
    .controls-box { padding: 10px 14px; }
    .controls-box .ctrl-title { font-size: 13px; }
    .controls-box .ctrl-line { font-size: 11px; }
    .sleep-bar { height: 22px; }
}
</style>
</head>
<body>

<div id="bg-spiral"></div>

<div class="game-container" id="game-container">

    <div class="start-screen" id="start-screen">
        <h1>Разбуди Игру</h1>
        <p class="subtitle">Тапай и ОРИ, чтобы разбудить тыкву</p>
        <div class="controls-box">
            <div class="ctrl-title">КАК ИГРАТЬ</div>
            <div class="ctrl-line"><span>1.</span> Нажми «Начать игру»</div>
            <div class="ctrl-line"><span>2.</span> Тапай — до 20% (+1% за тап)</div>
            <div class="ctrl-line"><span>3.</span> ОРИ ГРОМКО — до 95%</div>
            <div class="ctrl-line"><span>4.</span> Дойди до 100% — тыква проснётся</div>
        </div>
        <button class="btn" id="start-btn" type="button">Начать игру</button>
        <div class="hint-msg" id="mic-hint"></div>
    </div>

    <div id="game-screen" style="display:none;">
        <h1>Разбуди Игру</h1>
        <p class="subtitle">Тапай и ОРИ!</p>

        <div class="image-card" id="image-card">
            <img id="main-image" src="https://i.postimg.cc/4dKtwJcC/83D9FA9D-E798-4344-AFCA-A2B53597510D.png" alt="Спящая тыква">
        </div>

        <div class="sleep-bar">
            <div class="sleep-fill" id="sleep-fill"></div>
        </div>
    </div>

    <div class="end-screen" id="end-screen">
        <h1>ТЫКВА ПРОСНУЛАСЬ! 🎃</h1>
        <p class="sub">Ты разбудил (-а) Игру!</p>
        <p class="final">Не забудь отправить скрин в группу!</p>
    </div>

</div>

<script>
    // ===== ПАРАМЕТРЫ =====
    const IMAGE_SLEEPING = 'https://i.postimg.cc/4dKtwJcC/83D9FA9D-E798-4344-AFCA-A2B53597510D.png';
    const IMAGE_AWAKE    = 'https://i.postimg.cc/QtR7yRQ6/033FCCDF-5AD3-433D-9C60-000C793E6C1A.png';

    const DECAY_AFTER_TAP  = 3;
    const DECAY_AFTER_YELL = 8;
    const DECAY_NEUTRAL    = 3;

    const TAP_BOOST = 1;              // ← тап снова 1%
    const TAP_MAX_TOTAL = 20;         // тапы дают максимум 20%

    const MAX_LOUD_CAP = 95;
    const LOUD_MULTIPLIER = 400;
    const LOUD_THRESHOLD = 0.25;      // высокий порог — надо орать
    const LOUD_FULL_AT = 0.55;

    const ACTION_MEMORY_MS = 700;

    let fireLevel = 0;
    let tapContribution = 0;
    let started = false;
    let micOk = false;
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let micDataArray = null;
    let currentLoudness = 0;
    let lastTime = 0;
    let awakeImageReady = false;

    let lastAction = null;
    let lastActionTime = 0;

    (function preloadAwake() {
        const img = new Image();
        img.onload = () => { awakeImageReady = true; };
        img.src = IMAGE_AWAKE;
    })();

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        if (started) return;

        const micHint = document.getElementById('mic-hint');
        micHint.textContent = 'Запрашиваем микрофон...';
        micHint.className = 'hint-msg';

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                micDataArray = new Uint8Array(analyser.fftSize);
                micOk = true;
                micHint.textContent = '';
            } catch (err) {
                micOk = false;
                micHint.textContent = 'Микрофон недоступен — играем тапами (макс 20%).';
                micHint.className = 'hint-msg warn';
                await new Promise(r => setTimeout(r, 800));
            }
        } else {
            micOk = false;
            micHint.textContent = 'Микрофон не поддерживается — играем тапами.';
            micHint.className = 'hint-msg warn';
            await new Promise(r => setTimeout(r, 800));
        }

        startGame();
    });

    function startGame() {
        fireLevel = 0;
        tapContribution = 0;
        currentLoudness = 0;
        started = true;
        lastAction = null;
        lastActionTime = 0;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('image-card').classList.remove('awake');
        document.getElementById('main-image').src = IMAGE_SLEEPING;

        updateFireUI();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function gameLoop(now) {
        if (!started) return;

        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        let gain = 0;
        let yelling = false;

        if (micOk && analyser) {
            readMic();

            if (currentLoudness > LOUD_THRESHOLD && fireLevel < MAX_LOUD_CAP) {
                yelling = true;
                const norm = Math.min(1,
                    (currentLoudness - LOUD_THRESHOLD) / (LOUD_FULL_AT - LOUD_THRESHOLD));
                gain = norm * LOUD_MULTIPLIER * dt;
                if (fireLevel + gain > MAX_LOUD_CAP) gain = MAX_LOUD_CAP - fireLevel;
            }
        }

        if (yelling) {
            lastAction = 'yell';
            lastActionTime = now;
        }

        let decayRate;
        const sinceAction = now - lastActionTime;

        if (lastAction && sinceAction < ACTION_MEMORY_MS) {
            decayRate = (lastAction === 'yell') ? DECAY_AFTER_YELL : DECAY_AFTER_TAP;
        } else {
            decayRate = DECAY_NEUTRAL;
        }

        const decay = decayRate * dt;
        fireLevel = Math.max(0, Math.min(100, fireLevel + gain - decay));

        if (tapContribution > fireLevel) tapContribution = fireLevel;

        updateFireUI();

        if (fireLevel >= 100) {
            wakeUp();
            return;
        }

        requestAnimationFrame(gameLoop);
    }

    function readMic() {
        if (!analyser) return;
        analyser.getByteTimeDomainData(micDataArray);
        let sum = 0;
        for (let i = 0; i < micDataArray.length; i++) {
            const v = (micDataArray[i] - 128) / 128;
            sum += v * v;
        }
        currentLoudness = Math.sqrt(sum / micDataArray.length);
    }

    function updateFireUI() {
        const percent = Math.max(0, Math.min(100, fireLevel));
        const fill = document.getElementById('sleep-fill');
        fill.style.width = percent + '%';
        if (percent >= 70) fill.classList.add('hot');
        else fill.classList.remove('hot');
    }

    let lastTap = 0;
    function onAnyTap(x, y) {
        if (!started) return;
        if (fireLevel >= 100) return;
        const now = performance.now();
        if (now - lastTap < 40) return;
        lastTap = now;

        const canTap = tapContribution < TAP_MAX_TOTAL;
        if (canTap) {
            const remaining = TAP_MAX_TOTAL - tapContribution;
            const add = Math.min(TAP_BOOST, remaining);
            tapContribution += add;
            fireLevel = Math.min(100, fireLevel + add);
            updateFireUI();
        }

        lastAction = 'tap';
        lastActionTime = now;

        const flash = document.createElement('div');
        flash.className = 'tap-flash';
        flash.style.left = x + 'px';
        flash.style.top = y + 'px';
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 400);

        const counter = document.createElement('div');
        counter.className = 'tap-counter' + (canTap ? '' : ' blocked');
        counter.textContent = canTap ? '+1%' : '×';
        counter.style.left = x + 'px';
        counter.style.top = (y - 30) + 'px';
        document.body.appendChild(counter);
        setTimeout(() => counter.remove(), 600);

        if (fireLevel >= 100) wakeUp();
    }

    document.addEventListener('click', (e) => onAnyTap(e.clientX, e.clientY));
    document.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        if (t) onAnyTap(t.clientX, t.clientY);
    }, { passive: true });

    function wakeUp() {
        if (!started) return;
        started = false;

        const img = document.getElementById('main-image');
        const changeImage = () => {
            img.src = IMAGE_AWAKE;
            document.getElementById('image-card').classList.add('awake');
        };

        if (awakeImageReady) changeImage();
        else {
            const pre = new Image();
            pre.onload = changeImage;
            pre.onerror = changeImage;
            pre.src = IMAGE_AWAKE;
        }

        if (micStream) micStream.getTracks().forEach(t => t.stop());

        setTimeout(() => {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('end-screen').style.display = 'flex';
        }, 1400);
    }
</script>

</body>
</html>
